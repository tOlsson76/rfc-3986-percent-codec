[project]
name = "rfc-3986-percent-codec"
version = "0.1.2"
description = "Percent-encodes and decodes URIs per RFC 3986 with configurable safe character sets."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
